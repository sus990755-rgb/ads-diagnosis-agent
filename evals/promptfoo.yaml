description: ads-diagnosis-agent evaluation (25 cases)

prompts:
  - "诊断 {{date}} 的 Google Ads 投放数据"

providers:
  - id: file://provider.py
    label: agent
    config:
      timeout: 1200000  # python worker default 300s is too short for slow LLM runs

tests: file://tests.json

evaluateOptions:
  maxConcurrency: 1
